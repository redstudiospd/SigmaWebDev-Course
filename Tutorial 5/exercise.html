<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gautam Badgar">
    <title>Learning more about tables in HTML!</title>
</head>
<body>
    <div>
        <table border="1">
            <thead>
                <th colspan="2">Name</th>
                <th>Age</th>
                <th>City</th>
            </thead>

            <tr>
                <td>Alex</td>
                <td colspan="2">19</td>
                <td>Mumbai</td>
            </tr>

            <tr>
                <td>John</td>
                <td colspan="2">21</td>
                <td>New york</td>
            </tr>
        </table>
    </div>
</body>
</html>

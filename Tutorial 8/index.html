HTML INLINE ELEMENTS VS BLOCK ELEMENTS

1. INLINE ELEMENTS VS BLOCK ELEMENTS (1:10)

BLOCK ELEMENTS
Block elements start on a new line.
They normally take up the full available width of their parent container.
They are mainly used to create sections or larger structures on a webpage.

Examples:
<div>...</div>
<p>...</p>
<h1>...</h1>

INLINE ELEMENTS
Inline elements do not start on a new line.
They take up only as much width as their content needs.
They are commonly used inside text or inside block elements.

Examples:
<span>...</span>
<a href="#">Link</a>
<strong>Important</strong>

Simple difference:
Block elements create a new line and occupy the available width.
Inline elements stay in the same line and occupy only the required width.

Important:
These are the default browser display behaviors.
CSS can change an element's behavior using properties such as:
display: block;
display: inline;
display: inline-block;

A block element can normally contain inline elements.
Avoid placing block elements inside inline elements.

The <div> tag is a common block container.
The <span> tag is a common inline container.

Quick memory tip:
<div>, <p>, headings, lists, sections, and page layout tags
are generally block elements.

<span>, <a>, text-formatting tags, images, and form controls
are generally inline elements.

Note:
The list describes default display behavior.
CSS can change how any element is displayed.
Some elements, such as <img>, <input>, and <textarea>, are inline-level
by default but can have special sizing behavior.


3. QUICK QUIZ (7:34)

Question:
Which of the following are block elements and which are inline elements?

<div> <span> <p> <a> <h1> <strong> <ul> <img>

Answer:
Block elements:
<div>, <p>, <h1>, <ul>

Inline elements:
<span>, <a>, <strong>, <img>

Remember:
If the element starts on a new line and generally stretches across
the container, it is block-level by default.

If it remains in the current line and uses only the space it needs,
it is inline-level by default.


4. CONCLUSION (8:21)

Block elements are useful for creating the main structure and sections
of a webpage.

Inline elements are useful for styling, linking, or adding content
within a line of text.

The most important difference is their default layout behavior:
block elements start on a new line;
inline elements stay in the same line.

Use <div> for larger block sections.
Use <span> for small inline parts of text.

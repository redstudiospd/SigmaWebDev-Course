<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - CSS Box Model</title>
    <style>
        .product {
            padding: 15px;
            border: 1px solid black;
            margin: 10px;
        }

        .product-Laptop {
            background-color: lightblue;
        }

        .product-Headphones {
            background-color: lightyellow;
        }
    </style>
</head>

<body>
    <div class="product product-Laptop">
        <h3>Laptop</h3>
        <p>For work and study.</p>
    </div>

    <div class="product product-Headphones">
        <h3>Headphones</h3>
        <p>For music and focus.</p>
    </div>
</body>

</html>

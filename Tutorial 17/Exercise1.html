<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector Exercise 1</title>
    <style>
        /* ID property */
        #special{
            color: red;
        }

        /* text property */
        h1{
            text-align: center;
        }

        /* font property */
        p{
            font-size: 20px;
        }

        li{
            font-weight: bold;
        }

    </style>
</head>

<body>
    <h1>My Favorite Foods</h1>

    <p>Pizza</p>
    <p id="special">Biryani</p>
    <p>Chocolate</p>

    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>
</body>

</html>

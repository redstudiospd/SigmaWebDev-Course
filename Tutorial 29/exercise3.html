<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card design</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .font {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .size {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 14.5px;
        }

        h1:not(.font) {
            line-height: 0%;
        }

        h5 {
            border: 1px solid grey;
            border-radius: 20px;
            margin: 2px;
            padding: 1px;
            text-align: center;
            background-color: white;
            color: grey;
        }

        .tags {
            display: flex;
            gap: 8px;
        }

        .tags h5 {
            width: fit-content;
            margin: 2px 0;
            padding: 2px 6px;
        }

        .card-image {
            display: block;
            width: 100%;
            height: 180px;
            object-fit: fill;
            border-radius: 16px;
        }

        h5:not(.rm) {
            width: fit-content;
            margin: 2px;
            display: flex;
        }

        .rm {
            border: 2px solid rgb(202, 224, 231);
            border-radius: 35px;
            text-align: center;
            background-color: rgb(202, 224, 231);
            color: rgb(0, 132, 255);
            margin-left: 115px;
            padding: 5px;
            width: fit-content;

        }

        .box {
            width: min(360px, calc(100vw - 32px));
            margin: 34px auto;
            padding: 24px;
            height: auto;
            border: 2px solid lightgrey;
            border-radius: 16px;
        }
    </style>
</head>

<body>
    <div class="box">
        <img class="card-image" src="lago-di-braies.png" alt="Lago di Braies">
        <div class="tags">
            <h5 class="font">Nature</h5>
            <h5 class="font">Lake</h5>
        </div>
        <h1 class="font">Lago di Braies</h1>

        <p class="size">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos quo repellendus animi similique eos cupiditate
            ut, repellat odit.</p>

        <h5 class="font rm">Read More</h5>
    </div>
</body>

</html>

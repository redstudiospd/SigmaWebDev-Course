<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2: Blog Post</title>
    <style>
        .void {
            padding: 20px;
            border: 1.5px solid black;
            margin: 20px auto;
            min-height: 200px;
            max-width: 500px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: black;
        }

        h1{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: green;
            text-transform: uppercase;
            text-align: center;
        }

        h2{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 22.5px;
            color: grey;
            font-style: italic;
        }

        h3{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 23.5px;
            color: rgb(103, 100, 100);
        }

        p{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 15px;
            color: rgb(105, 103, 103);
            line-height: 20px;
        }

        .tagline{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 20px;
            text-decoration: underline;
            color: green;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="void">
        <h1> The World of Programming </h1>
        <h2> Technology. Learning. </h2>
        <h3> Why learning to code matters? </h3>
        <p> Programming helps you turn ideas into reality. With practice, you can build websites, create applications,
            and solve problems using code. </p>
        <p class="tagline">Start small. Keep building.</p>
    </div>
</body>

</html>

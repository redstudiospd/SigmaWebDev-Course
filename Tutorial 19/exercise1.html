<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: Profile Card</title>
    <style>
        h1 {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
            background-color: lightgray;
        }

        h2 {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: blue;
            text-decoration-line: underline;
            text-align: center;
            font-size: 24px;
        }

        p {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: black;
            font-weight: 400;
            text-align: center;
        }

        .boink {
            padding: 20px;
            border: 1.5px solid black;
            margin: 20px auto;
            min-height: 200px;
            max-width: 400px;
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="boink">
        <h1>Profile Card</h1>
        <h2> Alex Morgan </h2>
        <p>
            Frontend Developer. And I love building beautiful websites!
        </p>
    </div>
</body>

</html>
